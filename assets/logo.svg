<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Magic Swipe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2338"/>
      <stop offset="1" stop-color="#14101c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d77a"/>
      <stop offset="1" stop-color="#b8891c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f55"/>
      <stop offset="1" stop-color="#1f1a2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="210" fill="url(#glow)"/>

  <!-- Back card (discarded side) -->
  <g transform="translate(212 252) rotate(-14)">
    <rect x="-92" y="-128" width="184" height="256" rx="18" fill="#1f1a2b" stroke="#5a4d78" stroke-width="6"/>
    <rect x="-74" y="-110" width="148" height="220" rx="10" fill="none" stroke="#3a3150" stroke-width="4"/>
  </g>

  <!-- Front card, swiped to the right -->
  <g transform="translate(286 236) rotate(12)">
    <rect x="-96" y="-132" width="192" height="264" rx="20" fill="url(#face)" stroke="url(#gold)" stroke-width="8"/>
    <rect x="-76" y="-112" width="152" height="112" rx="10" fill="#14101c" stroke="#c9a227" stroke-opacity="0.6" stroke-width="3"/>
    <!-- Mana-like gem -->
    <path d="M0 -92 L26 -56 L0 -20 L-26 -56 Z" fill="url(#gold)"/>
    <path d="M0 -92 L26 -56 L0 -56 Z" fill="#fff" fill-opacity="0.25"/>
    <!-- Text lines -->
    <rect x="-76" y="16" width="152" height="10" rx="5" fill="#c9a227" fill-opacity="0.85"/>
    <rect x="-76" y="40" width="120" height="8" rx="4" fill="#a69cba" fill-opacity="0.7"/>
    <rect x="-76" y="60" width="136" height="8" rx="4" fill="#a69cba" fill-opacity="0.7"/>
    <rect x="-76" y="80" width="96" height="8" rx="4" fill="#a69cba" fill-opacity="0.7"/>
  </g>

  <!-- Swipe right = add -->
  <g transform="translate(424 352)">
    <circle r="46" fill="#14101c" stroke="#2ecc71" stroke-width="8"/>
    <path d="M-20 0 L-6 15 L22 -15" fill="none" stroke="#2ecc71" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Swipe left = discard -->
  <g transform="translate(92 352)">
    <circle r="40" fill="#14101c" stroke="#e74c3c" stroke-width="7"/>
    <path d="M-14 -14 L14 14 M14 -14 L-14 14" stroke="#e74c3c" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Motion arcs -->
  <path d="M150 440 Q256 480 362 440" fill="none" stroke="#c9a227" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M352 426 L368 440 L350 452" fill="none" stroke="#c9a227" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
</svg>
